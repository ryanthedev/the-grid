name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Server
        run: make server

      - name: Build CLI
        run: make cli

      - name: Build Viewer
        run: make viewer

      - name: Run Server tests
        run: make server-test

  build-universal:
    name: Build Universal Binaries
    runs-on: macos-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ad-hoc signing identity
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

      - name: Build universal distribution
        env:
          CODESIGN_IDENTITY: "-"
        run: make dist-universal

      - name: Verify universal binaries
        run: |
          VERSION=$(cat VERSION)

          echo "Server binary:"
          file "dist/thegrid-${VERSION}/GridServer.app/Contents/MacOS/grid-server"

          echo ""
          echo "CLI binary:"
          file "dist/thegrid-${VERSION}/bin/thegrid"

          echo ""
          echo "Viewer binary:"
          file "dist/thegrid-${VERSION}/bin/grid-viewer"

          # Verify all are universal
          file "dist/thegrid-${VERSION}/GridServer.app/Contents/MacOS/grid-server" | grep -q "universal binary" || (echo "Server is not universal!" && exit 1)
          file "dist/thegrid-${VERSION}/bin/thegrid" | grep -q "universal binary" || (echo "CLI is not universal!" && exit 1)
          file "dist/thegrid-${VERSION}/bin/grid-viewer" | grep -q "universal binary" || (echo "Viewer is not universal!" && exit 1)

          echo ""
          echo "Universal binaries verified successfully"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: thegrid-universal-${{ github.sha }}
          path: dist/thegrid-*-darwin-universal.tar.gz
          retention-days: 7
